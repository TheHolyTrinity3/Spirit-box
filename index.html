<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirit Box — SB-11</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --green: #00ff88;
    --dim-green: #00aa55;
    --dark-green: #003322;
    --red: #ff3333;
    --amber: #ffaa00;
    --bg: #050a07;
    --panel: #0a140d;
    --border: #1a3022;
    --glow: 0 0 8px #00ff8866, 0 0 20px #00ff8833;
    --glow-strong: 0 0 12px #00ff88, 0 0 30px #00ff8877, 0 0 60px #00ff8833;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: crosshair;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* Screen flicker */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,255,136,0.015);
    pointer-events: none;
    z-index: 999;
    animation: flicker 8s infinite;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.4; }
    99% { opacity: 0.9; }
  }

  .device {
    width: 480px;
    max-width: 95vw;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 28px 24px 24px;
    position: relative;
    box-shadow: 0 0 40px rgba(0,255,136,0.08), inset 0 0 30px rgba(0,0,0,0.5);
  }

  .device-header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }

  .model-tag {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 6px;
    color: var(--dim-green);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: var(--glow);
  }

  /* Frequency Display */
  .freq-display {
    background: #020804;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .freq-display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,255,136,0.03) 0%, transparent 100%);
  }

  .freq-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--dim-green);
    margin-bottom: 4px;
  }

  .freq-number {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 700;
    color: var(--green);
    text-shadow: var(--glow-strong);
    letter-spacing: 2px;
    line-height: 1;
    transition: opacity 0.05s;
  }

  .freq-unit {
    font-size: 11px;
    color: var(--dim-green);
    letter-spacing: 2px;
    margin-top: 2px;
  }

  .freq-band {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber);
  }

  /* Signal meter */
  .signal-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .signal-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim-green);
    min-width: 50px;
  }

  .signal-bars {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 20px;
    flex: 1;
  }

  .bar {
    width: 8px;
    background: var(--border);
    border-radius: 1px;
    transition: background 0.1s, box-shadow 0.1s;
  }

  .bar.active {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  .bar.active.mid { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .bar.active.high { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .bar:nth-child(1)  { height: 4px; }
  .bar:nth-child(2)  { height: 6px; }
  .bar:nth-child(3)  { height: 8px; }
  .bar:nth-child(4)  { height: 10px; }
  .bar:nth-child(5)  { height: 12px; }
  .bar:nth-child(6)  { height: 13px; }
  .bar:nth-child(7)  { height: 14px; }
  .bar:nth-child(8)  { height: 15px; }
  .bar:nth-child(9)  { height: 16px; }
  .bar:nth-child(10) { height: 17px; }
  .bar:nth-child(11) { height: 18px; }
  .bar:nth-child(12) { height: 19px; }
  .bar:nth-child(13) { height: 20px; }

  .scan-speed {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--dim-green);
    min-width: 40px;
    text-align: right;
  }

  /* Waveform */
  .waveform-wrap {
    background: #020804;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px;
    margin-bottom: 14px;
  }

  canvas#waveform {
    display: block;
    width: 100%;
    height: 60px;
  }

  /* Message display */
  .message-box {
    background: #020804;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 16px;
    min-height: 64px;
    position: relative;
  }

  .message-label {
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--dim-green);
    margin-bottom: 6px;
  }

  .message-text {
    font-size: 16px;
    color: var(--green);
    text-shadow: var(--glow);
    letter-spacing: 3px;
    min-height: 22px;
    font-family: 'Orbitron', monospace;
  }

  .message-text.glitch {
    animation: glitch 0.3s steps(1);
  }

  @keyframes glitch {
    0%   { transform: translate(2px, 0) skewX(2deg); opacity: 0.8; }
    20%  { transform: translate(-2px, 1px) skewX(-1deg); opacity: 0.6; }
    40%  { transform: translate(1px, -1px); opacity: 1; }
    60%  { transform: translate(-1px, 0) skewX(1deg); opacity: 0.7; }
    80%  { transform: translate(0, 1px); opacity: 0.9; }
    100% { transform: translate(0, 0); opacity: 1; }
  }

  .cursor-blink {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: var(--green);
    vertical-align: middle;
    margin-left: 3px;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Controls */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn {
    background: transparent;
    border: 1px solid var(--dim-green);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 12px 8px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .btn:hover::before { opacity: 0.08; }
  .btn:active::before { opacity: 0.2; }

  .btn:hover {
    border-color: var(--green);
    box-shadow: var(--glow);
    text-shadow: var(--glow);
  }

  .btn.active {
    border-color: var(--green);
    background: rgba(0,255,136,0.1);
    box-shadow: var(--glow-strong);
    text-shadow: var(--glow);
  }

  .btn.danger {
    border-color: #aa2222;
    color: var(--red);
  }

  .btn.danger:hover {
    border-color: var(--red);
    box-shadow: 0 0 12px var(--red);
    text-shadow: 0 0 8px var(--red);
  }

  /* Speed slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .slider-row label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim-green);
    min-width: 80px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--green);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px var(--green);
  }

  /* Status row */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #333;
    margin-right: 6px;
    vertical-align: middle;
    transition: all 0.2s;
  }

  .status-dot.on {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s infinite;
  }

  .status-dot.scanning { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 0.5s infinite; }

  @keyframes pulse { 50% { opacity: 0.4; } }

  .status-text {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim-green);
  }

  .session-timer {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim-green);
    font-family: 'Orbitron', monospace;
  }

  /* Log */
  .log-toggle {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim-green);
    cursor: pointer;
    text-align: center;
    margin-top: 10px;
    text-transform: uppercase;
    padding: 4px;
    border-top: 1px solid var(--border);
    transition: color 0.2s;
  }

  .log-toggle:hover { color: var(--green); }

  .log-box {
    display: none;
    background: #020804;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin-top: 10px;
    max-height: 120px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--dim-green) transparent;
  }

  .log-box.open { display: block; }

  .log-entry {
    font-size: 10px;
    color: var(--dim-green);
    padding: 2px 0;
    border-bottom: 1px solid #0d1f12;
    letter-spacing: 1px;
  }

  .log-entry .log-freq { color: var(--amber); margin-right: 8px; }
  .log-entry .log-msg { color: var(--green); }
</style>
</head>
<body>

<div class="device">
  <div class="device-header">
    <div class="model-tag">PARANORMAL RESEARCH INSTRUMENTS</div>
    <div class="title">SPIRIT BOX</div>
    <div class="model-tag" style="margin-top:4px;letter-spacing:4px;">MODEL SB-11 ◆ FM/AM SWEEP</div>
  </div>

  <!-- Frequency display -->
  <div class="freq-display">
    <div class="freq-label">FREQUENCY</div>
    <div class="freq-number" id="freqDisplay">87.5</div>
    <div class="freq-unit">MHz</div>
    <div class="freq-band" id="bandLabel">FM</div>
  </div>

  <!-- Signal bars -->
  <div class="signal-row">
    <div class="signal-label">SIGNAL</div>
    <div class="signal-bars" id="signalBars">
      <div class="bar" data-i="1"></div>
      <div class="bar" data-i="2"></div>
      <div class="bar" data-i="3"></div>
      <div class="bar" data-i="4"></div>
      <div class="bar" data-i="5"></div>
      <div class="bar" data-i="6"></div>
      <div class="bar" data-i="7"></div>
      <div class="bar" data-i="8"></div>
      <div class="bar" data-i="9"></div>
      <div class="bar" data-i="10"></div>
      <div class="bar" data-i="11"></div>
      <div class="bar" data-i="12"></div>
      <div class="bar" data-i="13"></div>
    </div>
    <div class="scan-speed" id="speedLabel">250ms</div>
  </div>

  <!-- Waveform canvas -->
  <div class="waveform-wrap">
    <canvas id="waveform" width="432" height="60"></canvas>
  </div>

  <!-- Message output -->
  <div class="message-box">
    <div class="message-label">AUDIO CAPTURE // LIVE</div>
    <div class="message-text" id="messageDisplay">
      <span class="cursor-blink"></span>
    </div>
  </div>

  <!-- Speed control -->
  <div class="slider-row">
    <label>SCAN RATE</label>
    <input type="range" id="speedSlider" min="1" max="5" value="3" step="1">
  </div>

  <!-- Buttons -->
  <div class="controls">
    <button class="btn" id="powerBtn" onclick="togglePower()">⏻ POWER</button>
    <button class="btn" id="scanBtn" onclick="toggleScan()" disabled>⟳ SCAN</button>
    <button class="btn" id="bandBtn" onclick="toggleBand()" disabled>◈ FM / AM</button>
    <button class="btn danger" id="clearBtn" onclick="clearLog()">✕ CLEAR LOG</button>
  </div>

  <!-- Status -->
  <div class="status-row">
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">OFFLINE</span>
    </div>
    <div class="session-timer" id="sessionTimer">00:00:00</div>
  </div>

  <!-- Log toggle -->
  <div class="log-toggle" onclick="toggleLog()">▼ SESSION LOG</div>
  <div class="log-box" id="logBox"></div>
</div>

<script>
// ─── State ───────────────────────────────────────────────
let powered = false;
let scanning = false;
let band = 'FM';
let freq = 87.5;
let scanInterval = null;
let waveInterval = null;
let timerInterval = null;
let sessionSeconds = 0;
let logOpen = false;
let audioCtx = null;
let capturedWords = [];
let scanSpeed = 250;

// FM: 87.5–108.0 MHz | AM: 530–1700 kHz
const bands = {
  FM: { min: 87.5, max: 108.0, step: 0.1, decimals: 1, unit: 'MHz' },
  AM: { min: 530,  max: 1700,  step:  10, decimals: 0, unit: 'kHz' }
};

// "Spirit" word bank — single word fragments that appear
const wordBank = [
  'HERE', 'HELP', 'COLD', 'DARK', 'LOST', 'WAIT',
  'YES', 'NO', 'HEAR', 'RUN', 'STAY', 'COME',
  'NEAR', 'LEAVE', 'HELLO', 'PLEASE', 'FEAR', 'ALONE',
  'LIGHT', 'GO', 'ALIVE', 'SOUL', 'HOME', 'WATCH',
  'THEM', 'WARN', 'LOOK', 'BEHIND', 'DOOR', 'FEEL',
  'WHY', 'WHEN', 'WHO', 'PAIN', 'FREE', 'TRAPPED'
];

// Speed map
const speedMap = { 1: 600, 2: 400, 3: 250, 4: 120, 5: 60 };
const speedLabels = { 1:'600ms', 2:'400ms', 3:'250ms', 4:'120ms', 5:'60ms' };

// ─── Audio ───────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playScan() {
  if (!audioCtx) return;
  const duration = scanSpeed / 1000;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  filter.type = 'bandpass';
  filter.frequency.value = 800 + Math.random() * 2000;
  filter.Q.value = 5 + Math.random() * 15;

  osc.type = ['sawtooth', 'square', 'triangle'][Math.floor(Math.random() * 3)];
  osc.frequency.setValueAtTime(200 + Math.random() * 800, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(100 + Math.random() * 1200, audioCtx.currentTime + duration);

  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.01);
  gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration + 0.05);
}

function playCapture() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.35);
}

// ─── Waveform Canvas ─────────────────────────────────────
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');
let waveData = new Array(100).fill(0);
let wavePhase = 0;

function drawWave() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  if (!scanning) {
    // Flat idle line
    ctx.strokeStyle = '#003322';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();
    return;
  }

  // Shift wave data
  waveData.shift();
  const newVal = (Math.random() - 0.5) * (0.6 + Math.random() * 0.4);
  waveData.push(newVal);

  // Draw
  ctx.strokeStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 4;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < waveData.length; i++) {
    const x = (i / (waveData.length - 1)) * w;
    const y = h / 2 + waveData[i] * (h / 2 - 4);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ─── Signal Bars ─────────────────────────────────────────
function updateSignal(level) {
  // level 0–13
  const bars = document.querySelectorAll('.bar');
  bars.forEach((bar, i) => {
    const n = i + 1;
    bar.classList.remove('active', 'mid', 'high');
    if (n <= level) {
      bar.classList.add('active');
      if (n > 9) bar.classList.add('high');
      else if (n > 6) bar.classList.add('mid');
    }
  });
}

// ─── Frequency step ──────────────────────────────────────
function stepFreq() {
  const b = bands[band];
  freq += b.step;
  if (freq > b.max) freq = b.min;

  const display = freq.toFixed(b.decimals);
  const el = document.getElementById('freqDisplay');
  el.textContent = display;
  // Occasional flicker
  if (Math.random() < 0.12) {
    el.style.opacity = '0.3';
    setTimeout(() => el.style.opacity = '1', 40);
  }

  // Random signal strength
  const sig = Math.floor(Math.random() * 14);
  updateSignal(sig);

  // Play sweep sound
  playScan();
  drawWave();

  // Occasionally show a word (rare)
  const chance = scanSpeed < 150 ? 0.04 : 0.07;
  if (Math.random() < chance) {
    showCapture();
  }
}

// ─── Word capture ─────────────────────────────────────────
function showCapture() {
  const word = wordBank[Math.floor(Math.random() * wordBank.length)];
  const display = document.getElementById('messageDisplay');
  playCapture();

  display.innerHTML = `<span style="animation:glitch 0.3s steps(1)">${word}</span><span class="cursor-blink"></span>`;
  display.classList.add('glitch');
  setTimeout(() => display.classList.remove('glitch'), 300);

  // Log it
  const b = bands[band];
  const freqStr = freq.toFixed(b.decimals) + ' ' + b.unit;
  addLog(freqStr, word);

  // Clear after a moment
  const holdTime = 600 + Math.random() * 1200;
  setTimeout(() => {
    if (scanning) {
      display.innerHTML = `<span class="cursor-blink"></span>`;
    }
  }, holdTime);
}

function addLog(freq, word) {
  const box = document.getElementById('logBox');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-freq">${freq}</span><span class="log-msg">${word}</span>`;
  box.insertBefore(entry, box.firstChild);
}

// ─── Power ───────────────────────────────────────────────
function togglePower() {
  initAudio();
  powered = !powered;
  const btn = document.getElementById('powerBtn');
  const scanBtn = document.getElementById('scanBtn');
  const bandBtn = document.getElementById('bandBtn');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  if (powered) {
    btn.classList.add('active');
    scanBtn.disabled = false;
    bandBtn.disabled = false;
    dot.classList.add('on');
    statusText.textContent = 'STANDBY';
    // Boot freq display
    setFreqDisplay();
    updateSignal(0);
    // Start session timer
    sessionSeconds = 0;
    timerInterval = setInterval(() => {
      sessionSeconds++;
      const h = String(Math.floor(sessionSeconds / 3600)).padStart(2,'0');
      const m = String(Math.floor((sessionSeconds % 3600) / 60)).padStart(2,'0');
      const s = String(sessionSeconds % 60).padStart(2,'0');
      document.getElementById('sessionTimer').textContent = `${h}:${m}:${s}`;
    }, 1000);
    // Start idle wave draw
    waveInterval = setInterval(drawWave, 100);
  } else {
    // Power off
    if (scanning) stopScan();
    btn.classList.remove('active');
    scanBtn.disabled = true;
    bandBtn.disabled = true;
    dot.classList.remove('on', 'scanning');
    statusText.textContent = 'OFFLINE';
    clearInterval(timerInterval);
    clearInterval(waveInterval);
    document.getElementById('freqDisplay').textContent = '--.-';
    updateSignal(0);
    drawWave();
  }
}

function setFreqDisplay() {
  const b = bands[band];
  document.getElementById('freqDisplay').textContent = freq.toFixed(b.decimals);
  document.getElementById('bandLabel').textContent = band;
  document.getElementById('freq-unit') && (document.getElementById('freq-unit').textContent = b.unit);
}

// ─── Scan ─────────────────────────────────────────────────
function toggleScan() {
  if (!powered) return;
  if (scanning) stopScan(); else startScan();
}

function startScan() {
  scanning = true;
  document.getElementById('scanBtn').classList.add('active');
  document.getElementById('scanBtn').textContent = '◼ STOP';
  document.getElementById('statusDot').classList.replace('on', 'scanning');
  document.getElementById('statusDot').classList.add('scanning');
  document.getElementById('statusText').textContent = 'SCANNING...';

  scanInterval = setInterval(stepFreq, scanSpeed);
  clearInterval(waveInterval);
  waveInterval = setInterval(drawWave, 50);
}

function stopScan() {
  scanning = false;
  clearInterval(scanInterval);
  clearInterval(waveInterval);
  document.getElementById('scanBtn').classList.remove('active');
  document.getElementById('scanBtn').textContent = '⟳ SCAN';
  const dot = document.getElementById('statusDot');
  dot.classList.remove('scanning');
  dot.classList.add('on');
  document.getElementById('statusText').textContent = 'STANDBY';
  document.getElementById('messageDisplay').innerHTML = `<span class="cursor-blink"></span>`;
  updateSignal(0);
  waveInterval = setInterval(drawWave, 100);
}

// ─── Band toggle ──────────────────────────────────────────
function toggleBand() {
  if (!powered) return;
  const wasScan = scanning;
  if (scanning) stopScan();
  band = band === 'FM' ? 'AM' : 'FM';
  freq = bands[band].min;
  document.getElementById('bandLabel').textContent = band;
  setFreqDisplay();
  if (wasScan) startScan();
}

// ─── Speed slider ─────────────────────────────────────────
document.getElementById('speedSlider').addEventListener('input', function() {
  const v = parseInt(this.value);
  scanSpeed = speedMap[v];
  document.getElementById('speedLabel').textContent = speedLabels[v];
  if (scanning) {
    clearInterval(scanInterval);
    scanInterval = setInterval(stepFreq, scanSpeed);
  }
});

// ─── Log toggle ───────────────────────────────────────────
function toggleLog() {
  logOpen = !logOpen;
  const box = document.getElementById('logBox');
  const toggle = document.querySelector('.log-toggle');
  box.classList.toggle('open', logOpen);
  toggle.textContent = (logOpen ? '▲' : '▼') + ' SESSION LOG';
}

function clearLog() {
  document.getElementById('logBox').innerHTML = '';
}

// ─── Init draw ────────────────────────────────────────────
drawWave();
</script>
</body>
</html>
